# Render Blueprint — Genuine Homes backend (API + PostgreSQL/PostGIS + Redis).
# Render reads this file when you create a "Blueprint" from the GitHub repo and
# provisions all three resources on the free tier. The frontend is deployed
# separately on Vercel (see vercel.json + docs/DEPLOYMENT.md).
#
# NOTE: free web services sleep after ~15 min of inactivity; the first request
# after that takes ~50s to wake. This is normal for the free tier.

databases:
  - name: genuine-homes-db
    plan: free
    postgresMajorVersion: '16'
    # PostGIS is enabled by the first Prisma migration (CREATE EXTENSION postgis).

services:
  # Redis — backs rate limiting, sessions, and the BullMQ notification queue.
  - type: redis
    name: genuine-homes-redis
    plan: free
    ipAllowList: [] # internal access only (reachable by the API service)
    maxmemoryPolicy: noeviction # required for BullMQ job durability

  # NestJS API.
  - type: web
    name: genuine-homes-api
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /api/health
    # Build: install the whole pnpm workspace, build the shared package, generate
    # the Prisma client, then compile the API.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm build:shared &&
      pnpm --filter @genuine-homes/api prisma:generate &&
      pnpm --filter @genuine-homes/api build
    # Start: apply pending migrations (idempotent), then boot. Render injects PORT.
    startCommand: >-
      pnpm --filter @genuine-homes/api prisma:deploy &&
      pnpm --filter @genuine-homes/api start:prod
    envVars:
      - key: NODE_ENV
        value: production
      # No real payment keys → run the mock gateway. Production refuses the mock
      # unless it is chosen explicitly, so this must be set.
      - key: PAYMENT_GATEWAY
        value: mock
      # Wired automatically from the managed resources above.
      - key: DATABASE_URL
        fromDatabase:
          name: genuine-homes-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: genuine-homes-redis
          property: connectionString
      # Strong secrets generated once by Render and kept stable across deploys.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set these in the Render dashboard AFTER the Vercel URL is known
      # (Blueprint will leave them blank for you to fill — see DEPLOYMENT.md).
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
